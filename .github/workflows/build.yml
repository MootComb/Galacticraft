name: Build

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/gradle-wrapper.properties', 'settings.gradle.kts', 'build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and publish Mojarn locally
        run: |
          git clone https://github.com/teamgalacticraft/mojarn.git
          cd mojarn
          chmod +x gradlew
          ./gradlew publishToMavenLocal --stacktrace
          ls -la ~/.m2/repository/dev/galacticraft/mojarn/
          cd ..

      - name: Initialize build environment
        run: ./gradlew --stacktrace

      - name: Spotless check
        run: ./gradlew spotlessCheck --stacktrace

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: ./gradlew assemble testClasses -x spotlessCheck --stacktrace

      - name: Test
        if: ${{ steps.build.outcome == 'success' && !cancelled() }}
        run: ./gradlew test -x spotlessCheck --stacktrace

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Galacticraft
          path: |
            build/libs/
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
            !build/libs/*-dev.jar
